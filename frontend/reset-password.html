<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reset password — PULSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
    <meta name="theme-color" content="#04060a">
</head>
<body>

    <main class="auth-shell">

        <section class="card auth-card">

            <a href="login.html" class="auth-back">← Back to sign in</a>
            <h1>Choose a new password</h1>

            <p>Use at least 8 characters.</p>

            <p id="form-error" class="form-alert"></p>

            <form id="reset-form">

                <div class="field">
                    <label for="password">New password</label>
                    <input
                        class="input"
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Update password
                </button>
            </form>

        </section>
    </main>

    <script type="module" src="reset-password.js"></script>

    <script src="motion.js" defer></script>
</body>
</html>
