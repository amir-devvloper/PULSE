<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create Account — PULSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
    <meta name="theme-color" content="#04060a">
</head>
<body>

    <main class="auth-shell">

        <section class="card auth-card">

            <a href="index.html" class="auth-back">← PULSE</a>
            <h1>Create your account</h1>

            <p>Start monitoring your services.</p>

            <p id="form-error" class="form-alert"></p>

            <form id="signup-form">

                <div class="field">
                    <label for="name">Name</label>
                    <input
                        class="input"
                        type="text"
                        name="name"
                        id="name"
                        placeholder="Your name"
                        required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        class="input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input
                        class="input"
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="8"
                        required>
                    <span class="field-hint">At least 8 characters.</span>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Create Account
                </button>
            </form>

            <p class="auth-foot">
                Already have an account? <a href="login.html" class="link">Sign in</a>
            </p>
        </section>
    </main>

    <script type="module" src="signup.js"></script>

    <script src="motion.js" defer></script>
</body>
</html>
